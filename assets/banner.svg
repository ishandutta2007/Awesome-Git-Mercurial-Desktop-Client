<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#f78166" />
    </linearGradient>

    <linearGradient id="accent-git" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05032" />
      <stop offset="100%" stop-color="#ff7b54" />
    </linearGradient>

    <linearGradient id="accent-hg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#999999" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>

    <linearGradient id="stream-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="stream-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#58a6ff" fill-opacity="0.2" />
    </pattern>

    <!-- Style for Animations -->
    <style>
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.85; }
        50% { transform: translateY(-6px) scale(1.04); opacity: 1; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }
      @keyframes branchOrbit {
        0% { transform: translateX(0); }
        50% { transform: translateX(15px); }
        100% { transform: translateX(0); }
      }
      .flow-path-1 {
        stroke-dasharray: 12 14;
        animation: dash 35s linear infinite;
      }
      .flow-path-2 {
        stroke-dasharray: 8 10;
        animation: dash 25s linear infinite reverse;
      }
      .pulse-node {
        animation: pulseGlow 3s ease-in-out infinite;
      }
      .floating-card {
        animation: floatPulse 6s ease-in-out infinite;
      }
      .pill-hover {
        transition: transform 0.3s ease;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Git DAG Network (Background Layer) -->
  <g opacity="0.65">
    <!-- Branch Line 1 (Main trunk) -->
    <path class="flow-path-1" d="M -50 290 Q 200 290 350 250 T 700 250 T 1000 300 T 1250 300" fill="none" stroke="url(#stream-cyan)" stroke-width="3.5" filter="url(#glow-cyan)" />

    <!-- Branch Line 2 (Feature branch merging) -->
    <path class="flow-path-2" d="M 100 340 C 280 340, 320 220, 520 220 S 780 270, 950 230 S 1120 210, 1250 210" fill="none" stroke="url(#stream-purple)" stroke-width="2.5" />

    <!-- Branch Line 3 (Top atmospheric arc) -->
    <path class="flow-path-1" d="M -20 70 Q 300 30 600 60 T 1220 50" fill="none" stroke="#f05032" stroke-opacity="0.25" stroke-width="2" />

    <!-- Animated Commit Nodes in Background -->
    <g class="pulse-node">
      <circle cx="240" cy="275" r="5" fill="#58a6ff" filter="url(#glow-cyan)" />
      <circle cx="430" cy="235" r="4" fill="#a371f7" />
      <circle cx="680" cy="245" r="6" fill="#3fb950" />
      <circle cx="890" cy="250" r="5" fill="#f0883e" filter="url(#glow-orange)" />
      <circle cx="1060" cy="285" r="4.5" fill="#58a6ff" />
    </g>

    <!-- Branch Connector Links -->
    <line x1="350" y1="250" x2="430" y2="235" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6" />
    <line x1="680" y1="245" x2="760" y2="260" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6" />
  </g>

  <!-- Foreground Title and Hero Content (Strictly Layered on Top) -->
  <g transform="translate(80, 55)">
    <!-- Top Meta Badges -->
    <g transform="translate(0, 0)">
      <!-- Badge 1: Curated Directory -->
      <rect x="0" y="0" width="135" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="14" cy="13" r="4.5" fill="#58a6ff" />
      <text x="26" y="17" fill="#c9d1d9" font-size="11" font-weight="600" letter-spacing="0.4">CURATED LIST</text>

      <!-- Badge 2: Open Source & Commercial -->
      <rect x="145" y="0" width="170" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="159" cy="13" r="4.5" fill="#3fb950" />
      <text x="171" y="17" fill="#c9d1d9" font-size="11" font-weight="600" letter-spacing="0.4">GIT &amp; MERCURIAL</text>

      <!-- Badge 3: Cross Platform -->
      <rect x="325" y="0" width="165" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="339" cy="13" r="4.5" fill="#f0883e" />
      <text x="351" y="17" fill="#c9d1d9" font-size="11" font-weight="600" letter-spacing="0.4">CROSS-PLATFORM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-1">
      Awesome Git &amp; Mercurial Clients
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="125" font-size="18" font-weight="400" fill="#8b949e">
      The definitive directory of GUI clients, TUI tools, and diff visualizers for version control.
    </text>
    <text x="0" y="152" font-size="14" font-weight="400" fill="#6e7681">
      Featuring pricing benchmarks, free tier limits, company scale metrics, and open-source star rankings.
    </text>

    <!-- Visual Interactive Feature Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: Lazygit / TUI -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="145" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
        <rect x="10" y="10" width="16" height="16" rx="4" fill="#238636" />
        <text x="14" y="22" font-size="10" font-weight="bold" fill="#ffffff">TUI</text>
        <text x="34" y="23" font-size="13" font-weight="600" fill="#e6edf3">Lazygit &amp; Tig</text>
      </g>

      <!-- Pill 2: GitKraken & Tower -->
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="175" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
        <rect x="10" y="10" width="16" height="16" rx="4" fill="#1f6feb" />
        <text x="13" y="22" font-size="9" font-weight="bold" fill="#ffffff">PRO</text>
        <text x="34" y="23" font-size="13" font-weight="600" fill="#e6edf3">GitKraken / Tower</text>
      </g>

      <!-- Pill 3: Native GUIs -->
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
        <rect x="10" y="10" width="16" height="16" rx="4" fill="#da3633" />
        <text x="13" y="22" font-size="9" font-weight="bold" fill="#ffffff">GIT</text>
        <text x="34" y="23" font-size="13" font-weight="600" fill="#e6edf3">GitHub Desktop</text>
      </g>

      <!-- Pill 4: Mercurial Support -->
      <g transform="translate(530, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
        <rect x="10" y="10" width="16" height="16" rx="4" fill="#8957e5" />
        <text x="13" y="22" font-size="9" font-weight="bold" fill="#ffffff">HG</text>
        <text x="34" y="23" font-size="13" font-weight="600" fill="#e6edf3">TortoiseHg &amp; Hg</text>
      </g>

      <!-- Pill 5: Fast Staging & Virtual Branches -->
      <g transform="translate(705, 0)">
        <rect x="0" y="0" width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
        <rect x="10" y="10" width="16" height="16" rx="4" fill="#d29922" />
        <text x="13" y="22" font-size="9" font-weight="bold" fill="#ffffff">OSS</text>
        <text x="34" y="23" font-size="13" font-weight="600" fill="#e6edf3">GitButler &amp; Magit</text>
      </g>
    </g>
  </g>

  <!-- Floating Decorative Feature Card on the Right -->
  <g class="floating-card" transform="translate(970, 48)">
    <rect width="180" height="175" rx="14" fill="#161b22" fill-opacity="0.9" stroke="#30363d" stroke-width="1.5" />
    <circle cx="28" cy="28" r="10" fill="#238636" fill-opacity="0.25" />
    <path d="M24 28 L27 31 L32 25" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" />
    <text x="46" y="32" font-size="13" font-weight="700" fill="#f0f6fc">VCS Intelligence</text>
    
    <line x1="16" y1="52" x2="164" y2="52" stroke="#21262d" stroke-width="1.5" />
    
    <text x="18" y="74" font-size="11" fill="#8b949e">Proprietary / SaaS</text>
    <text x="162" y="74" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="end">7 Clients</text>

    <text x="18" y="102" font-size="11" fill="#8b949e">Open-Source Hub</text>
    <text x="162" y="102" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="end">13 Tools</text>

    <text x="18" y="130" font-size="11" fill="#8b949e">Max Community Stars</text>
    <text x="162" y="130" font-size="12" font-weight="bold" fill="#e3b341" text-anchor="end">83k+ ⭐</text>

    <rect x="18" y="146" width="144" height="18" rx="9" fill="#21262d" />
    <text x="90" y="159" font-size="10" font-weight="600" fill="#a5d6ff" text-anchor="middle">v2026 Verified Data</text>
  </g>
</svg>
